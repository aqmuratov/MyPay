<!DOCTYPE html>
<html lang="uz">
<head>

  <style>

    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
    :root{--bg:#121214;--card:#1f1f22;--blue:#1a73ff;--muted:#9b9ba1;--line:#2c2c30}
    body{background:var(--bg);color:#fff;max-width:480px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 0 120px}
    a{color:inherit;text-decoration:none}
    .i{width:24px;height:24px;flex:none}
    .muted{color:var(--muted);font-size:14px}
    .top{padding:22px 24px 8px}.top h2{font-size:24px}
    .card{background:var(--card);border-radius:16px;padding:16px;margin:14px 24px}
    input{width:100%;padding:15px;border:0;border-radius:12px;margin:8px 0;font-size:16px;background:#2a2a2e;color:#fff;outline:0}
    button,.btn{display:block;width:100%;text-align:center;background:var(--blue);color:#fff;border:0;padding:15px;border-radius:12px;font-size:16px;cursor:pointer;margin-top:8px}
    .tx{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
    .tx:last-child{border:0}
    .plus{color:#34d399}.minus{color:#f87171}
    .msg{margin:12px 24px;padding:12px;border-radius:12px;background:#3a3320}
    .msg.success{background:#16382b}.msg.error{background:#40201f}
    a.link{color:var(--blue)}

    /* Bosh sahifa */
    .hdr{display:flex;align-items:center;gap:14px;padding:22px 24px 10px}
    .avatar{position:relative;width:52px;height:52px;border-radius:18px;border:3px solid var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;background:#2a2a2e;flex:none}
    .chk{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center}
    .chk .i{width:12px;height:12px;color:#fff}
    .search{flex:1;background:#2a2a2e;border-radius:12px;padding:14px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:18px}
    .bell{color:var(--blue);width:30px;height:30px}
    .balance{position:relative;padding:22px 24px 10px 72px;min-height:190px}
    .biz{position:absolute;left:0;top:14px;width:48px;height:180px;background:#fff;color:#111;border-radius:16px 0 0 16px;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
    .lg{font-size:20px}
    .big{font-size:46px;font-weight:700;line-height:1.1;margin:4px 0 14px}
    .big small{font-size:28px}
    .row{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;margin-top:6px}
    .dot{width:28px;height:28px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center}
    .dot .i{width:14px;height:14px;color:#fff}
    .eye{position:absolute;right:24px;top:70px;width:auto;margin:0;padding:0;background:none;color:var(--muted)}
    .eye .i{width:34px;height:34px}
    .promo{position:absolute;right:24px;bottom:6px;background:#e8112d;padding:12px 24px;border-radius:30px;font-weight:800;font-style:italic;font-size:22px}
    .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 24px;margin-top:6px}
    .tiles a{background:var(--card);border-radius:16px;padding:18px 4px;text-align:center;font-size:15px;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:10px}
    .tiles .i{color:var(--blue);width:34px;height:34px}
    .my{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:16px;padding:18px;margin:14px 24px}
    .my .logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#29c5ff,#1a73ff);display:flex;align-items:center;justify-content:center;flex:none}
    .my .logo .i{color:#fff}
    .my b{font-size:20px;font-weight:600;display:block}
    .my .go{margin-left:auto;color:var(--muted)}
    .banners{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 24px;scrollbar-width:none}
    .banners::-webkit-scrollbar{display:none}
    .banner{flex:0 0 100%;scroll-snap-align:center;background:#f1f2f4;color:#111;border-radius:16px;padding:22px 20px;min-height:138px}
    .banner b{font-size:24px;line-height:1.15;display:block;margin-bottom:14px;max-width:62%}
    .banner span{background:var(--blue);color:#fff;padding:9px 40px 9px 14px;border-radius:8px;font-weight:600;font-size:15px}
    .banner.b2{background:linear-gradient(135deg,#1a73ff,#7c3aed);color:#fff}
    .banner.b2 span{background:#fff;color:var(--blue)}
    .sec{display:flex;justify-content:space-between;align-items:center;padding:26px 24px 6px;font-size:22px;font-weight:700}
    .sec a{color:var(--blue);font-size:16px;font-weight:500}
    .minis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 4px;padding:14px 12px;text-align:center}
    .minis a{font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
    .minis .mi{font-size:36px;line-height:1}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 24px}
    .grid a{background:var(--card);border-radius:16px;padding:18px 6px;text-align:center;font-size:14px}
    .grid .ic{font-size:30px;margin-bottom:6px}
    .fab{position:fixed;bottom:96px;right:max(16px,calc(50% - 224px));width:64px;height:64px;border-radius:50%;background:#1b1b1d;border:1px solid #3a3a3e;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
    .fab .i{width:30px;height:30px;color:#fff}

    /* Pastki menyu */
    nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#1c1c1f;display:flex;justify-content:space-around;padding:12px 0 calc(14px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0}
    nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:#8e8e93;position:relative}
    nav a.on{color:var(--blue)}
    nav .i{width:34px;height:34px}
    .new{position:absolute;top:-8px;right:4px;background:#ff5a1f;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px}
        /* tepada qotib turadigan sarlavha */
    .hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
    /* Mini Apps */
    .minis{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 4px;padding:14px 12px 4px;text-align:center}
    .minis a{font-size:14px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:8px}
    .mic{position:relative;width:48px;height:48px}
    .mic svg{width:48px;height:48px;display:block}
    .bdg{position:absolute;top:-8px;right:-16px;font-size:12px;font-weight:700;color:#fff;padding:3px 8px;border-radius:12px;font-style:normal}
    .bdg.nw{background:var(--blue)}.bdg.red{background:#e11d48}
    /* Mobil aloqa to'lovi */
    .phone{display:flex;gap:12px;padding:14px 24px 0}
    .phone .inp{flex:1;position:relative}
    .phone input{margin:0;background:#202023;border:1.5px solid #4a4a50;padding:16px 56px 16px 16px;font-size:18px}
    .phone .pk{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center}
    .phone .pk .i{width:20px;height:20px;color:#121214}
    .phone button{width:168px;margin:0;padding:0;font-size:20px;font-weight:600}
    /* Reklama kartalari */
    .stories{display:flex;gap:10px;overflow-x:auto;padding:22px 24px 6px;scrollbar-width:none}
    .stories::-webkit-scrollbar{display:none}
    .story{flex:0 0 164px;height:164px;border-radius:18px;border:3px solid var(--blue);overflow:hidden;position:relative;padding:12px;color:#111;background:#fff}
    .story b{font-size:17px;line-height:1.1;display:block;font-weight:800}
    .story .ph{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);width:84px}
    .s2{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
    .s2 .big0{font-size:54px;font-weight:900;color:var(--blue);line-height:1}
    .s2 span.t{font-size:13px;color:#555}
    .s3{background:linear-gradient(160deg,#7c3aed,#ec4899);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
    .s3 .pill{align-self:flex-start;background:rgba(255,255,255,.25);padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700}
    .s3 b{font-size:26px}
    .s4{background:var(--blue);color:#fff;display:flex;align-items:flex-end}
    /* Joylarda to'lov */
    .place{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:12px;margin:10px 24px}
    .place b{font-size:20px;display:block;margin-bottom:6px;font-weight:700}
    .place .muted{display:flex;align-items:center;gap:6px;font-size:16px}
    .nv{width:18px;height:18px}
    .pl{width:66px;height:66px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
    .pl svg{width:40px;height:40px;color:#fff}
    .pl1{background:linear-gradient(135deg,#22d3ee,#0ea5e9)}
    .pl2{background:#000;border:1px solid #333}
    .settings{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--blue);font-size:21px;font-weight:700;padding:34px 0 14px}
    .settings .i{width:34px;height:34px}
    /* To'lovlar sahifasi */
    .grid .ic .i{width:32px;height:32px;color:var(--blue)}
        /* To'lov sahifasi */
    .ptitle{text-align:center;font-size:22px;font-weight:700;padding:26px 0 18px}
    .psrow{display:flex;align-items:center;gap:14px;padding:0 24px}
    .psearch{flex:1;display:flex;align-items:center;gap:10px;background:#2a2a2e;border-radius:12px;padding:0 14px;color:var(--muted)}
    .psearch .i{width:28px;height:28px}
    .psearch input{margin:0;padding:16px 0;background:none;font-size:19px}
    .psearch input::placeholder{color:#74747b}
    .pqr{color:var(--blue);flex:none}
    .pqr .i{width:44px;height:44px}
    .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:30px 12px 6px;text-align:center}
    .quick a{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:15px;line-height:1.2;padding:0 2px}
    .quick .i{width:46px;height:46px}
    .saved{display:inline-block;width:190px;background:var(--card);border-radius:16px;padding:14px;margin:26px 0 10px 24px;vertical-align:top}
    .saved .si{width:38px;height:38px;border-radius:8px;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
    .saved .si .i{width:24px;height:24px}
    .saved b{display:block;font-size:17px;margin-bottom:4px}
    .saved .muted{font-size:15px;line-height:1.35}
    .cats{padding-top:16px}
    .cat{background:var(--card);border-radius:14px;margin:12px 24px}
    .cat>summary,.cat>a{display:flex;align-items:center;gap:16px;padding:22px 18px;font-size:22px;list-style:none;cursor:pointer}
    .cat>summary::-webkit-details-marker{display:none}
    .cat .i{width:34px;height:34px;color:var(--blue)}
    .cat .sub{display:block;padding:4px 18px 14px 68px}
    .cat .sub a{display:block;padding:12px 0;font-size:19px;border-top:1px solid var(--line)}
    .cat.hide{display:none}
        /* O'tkazma sahifasi */
    .tsearch{display:flex;align-items:center;gap:10px;margin:0 24px;padding:8px 10px 8px 16px;background:#202023;border:1.5px solid #4a4a50;border-radius:14px}
    .tsearch input{margin:0;padding:10px 0;background:none;font-size:18px;flex:1;min-width:0}
    .tsearch input::placeholder{color:#8a8a91;font-size:17px}
    .tsearch .i{width:40px;height:40px;flex:none}
    .tsearch .sc{color:var(--blue)}
    .ttiles{display:flex;gap:12px;overflow-x:auto;padding:22px 24px 4px;scrollbar-width:none}
    .ttiles::-webkit-scrollbar{display:none}
    .ttiles a{flex:0 0 136px;height:106px;background:var(--card);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;font-size:16px;line-height:1.25}
    .ttiles .i{width:32px;height:32px;color:var(--blue)}
    .bigrow{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:16px;padding:22px 18px;margin:16px 24px 6px;font-size:21px}
    .bigrow .i{width:30px;height:30px;color:var(--blue);flex:none}
    .bigrow .go{margin-left:auto;color:var(--muted);width:28px;height:28px}
    .dlabel{color:var(--muted);font-size:17px;padding:18px 24px 4px}
    .rec{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:18px;padding:14px;margin:10px 24px}
    .rav{width:56px;height:56px;border-radius:50%;background:#121214;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
    .rec .nm{flex:1;min-width:0}
    .rec b{display:block;font-size:21px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis}
    .rec .mk{color:var(--muted);font-size:19px;letter-spacing:.5px}
    .racts{display:flex;align-items:center;gap:14px;color:#a3a3aa}
    .racts .i{width:30px;height:30px}
    .racts hr{width:1px;height:28px;border:0;background:#4a4a50}
    .hide{display:none!important}
    .empty{text-align:center;padding:50px 24px;color:var(--muted)}
        /* Hisobotlar */
    .hide{display:none!important}
    .htop{display:flex;align-items:center;justify-content:space-between;padding:28px 24px 14px}
    .htop h1{font-size:40px;font-weight:700}
    .htop .acts{display:flex;gap:22px;color:var(--blue)}
    .htop .acts .i{width:40px;height:40px}
    .chips{display:flex;gap:10px;overflow-x:auto;padding:16px 24px 6px;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chips select{flex:none;appearance:none;-webkit-appearance:none;color:#fff;border:0;border-radius:26px;padding:16px 42px 16px 20px;font-size:18px;outline:0;
      background:#2a2a2e url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%231a73ff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 14px center}
    .sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 24px 0}
    .sum>div{background:var(--card);border-radius:18px;padding:16px 14px}
    .sum .l{color:var(--muted);font-size:14px;margin-bottom:10px}
    .sum .v{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:700;white-space:nowrap}
    .sum .v small{font-size:16px;color:var(--muted);font-weight:500}
    .sum .v .i{width:28px;height:28px;flex:none}
    .mon{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:18px;padding:20px 18px;margin:14px 24px 0}
    .mon .i{width:36px;height:36px;flex:none}
    .mon b{display:block;font-size:21px;margin-bottom:4px}
    .mon span{color:var(--muted);font-size:17px;line-height:1.3}
    .mon .go{margin-left:auto;color:var(--muted);width:28px;height:28px}
    .dh{padding:28px 24px 0}
    .dh h3{font-size:25px;font-weight:700;margin-bottom:2px}
    .dh .sub{display:flex;justify-content:space-between;color:var(--muted);font-size:18px}
    .hrow{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:18px;padding:14px;margin:14px 24px 0}
    .hi{width:72px;height:72px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;color:var(--blue)}
    .hi .i{width:40px;height:40px}
    .hrow .nm{flex:1;min-width:0}
    .hrow .nm b{display:block;font-size:21px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
    .hrow .nm span{color:var(--muted);font-size:17px}
    .hrow .am{text-align:right;font-size:21px;font-weight:700;white-space:nowrap}
    .hrow .am small{font-size:16px;font-weight:500;color:#cfd0d4}
    .hrow .am i{display:block;font-style:normal;color:var(--muted);font-size:16px;font-weight:400;margin-top:6px}
    .hrow .am.in{color:#34d399}
        /* Mini Apps */
    .mh{display:flex;justify-content:space-between;align-items:center;padding:28px 24px 12px}
    .mh h1{font-size:40px;font-weight:700}
    .reg{appearance:none;-webkit-appearance:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%231a73ff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right center;border:0;color:var(--blue);font-size:21px;padding:6px 28px 6px 0;outline:0;margin:0;width:auto}
    .reg option{background:#1f1f22;color:#fff}
    .mtitle{padding:30px 24px 0;font-size:25px;font-weight:700}
    .sg{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 4px;padding:18px 12px 0;text-align:center}
    .sg a{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:16px;line-height:1.2;padding:0 2px}
    .sg .mic{width:50px;height:50px}.sg .mic svg{width:50px;height:50px}
    .cch{display:flex;gap:10px;overflow-x:auto;padding:30px 24px 6px;scrollbar-width:none}
    .cch::-webkit-scrollbar{display:none}
    .chip{flex:none;display:flex;align-items:center;gap:10px;background:#2a2a2e;border-radius:26px;padding:13px 18px;font-size:19px;cursor:pointer}
    .chip .i{width:26px;height:26px;color:var(--blue)}
    .chip.on{background:var(--blue)}
    .chip.on .i{color:#fff}
    .mapp{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:16px;padding:16px;margin:10px 24px}
    .mapp .mlg{width:42px;height:42px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px;color:#fff;flex:none}
    .mapp b{display:block;font-size:22px;font-weight:600;margin-bottom:4px}
    .mapp span{color:var(--muted);font-size:18px;line-height:1.3}
    .mon .dots{color:var(--blue)}
        /* Kenglik 576 ga moslandi */
    body{max-width:576px}
    nav{max-width:576px}
    .fab{right:max(24px,calc(50% - 264px))}
    /* Ilova hissi */
    html{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
    body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
    input{-webkit-user-select:text;user-select:text}
  </style>
